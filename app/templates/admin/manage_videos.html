{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <h2 class="mb-4">Управление видео</h2>

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h3 class="card-title">Добавить новое видео</h3>
                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="title" class="form-label">Название:</label>
                            <input type="text" class="form-control" name="title" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Описание:</label>
                            <textarea class="form-control" name="description" rows="3" required></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="file_path" class="form-label">Загрузить видео:</label>
                            <input type="file" class="form-control" name="file_path" 
                                   accept="video/mp4,video/avi,video/mov" required>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" name="add_video" class="btn btn-primary">
                                Добавить видео
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title">Удалить видео</h3>
                    <form method="POST">
                        <div class="mb-3">
                            <label for="video_id" class="form-label">Выберите видео:</label>
                            <select class="form-select" name="video_id" required>
                                {% for video in videos %}
                                <option value="{{ video.id }}">{{ video.id }} - {{ video.title }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" name="delete_video" class="btn btn-danger">
                                Удалить видео
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
