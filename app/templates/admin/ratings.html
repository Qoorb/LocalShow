{% extends 'base.html' %}

{% block content %}
<div class="card shadow">
    <div class="card-body">
        <h2 class="card-title mb-4">Рейтинги видео (Админ)</h2>
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID Видео</th>
                        <th>Название видео</th>
                        <th>Всего оценок</th>
                        <th>Лайки</th>
                        <th>Дизлайки</th>
                    </tr>
                </thead>
                <tbody>
                    {% for rating in ratings %}
                    <tr>
                        <td>{{ rating.id }}</td>
                        <td>{{ rating.title }}</td>
                        <td>{{ rating.total_ratings or 0 }}</td>
                        <td>
                            <span class="badge bg-success">
                                <i class="bi bi-hand-thumbs-up"></i> {{ rating.likes or 0 }}
                            </span>
                        </td>
                        <td>
                            <span class="badge bg-danger">
                                <i class="bi bi-hand-thumbs-down"></i> {{ rating.dislikes or 0 }}
                            </span>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
