{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <h2 class="mb-4">Панель управления администратора</h2>
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Управление видео</h5>
                    <div class="list-group">
                        <a href="{{ url_for('admin.admin_videos') }}" class="list-group-item list-group-item-action">
                            Просмотр каталога
                        </a>
                        <a href="{{ url_for('admin.admin_manage_videos') }}" class="list-group-item list-group-item-action">
                            Добавить видео
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Статистика</h5>
                    <div class="list-group">
                        <a href="{{ url_for('admin.admin_ratings') }}" class="list-group-item list-group-item-action">
                            Рейтинги
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Система</h5>
                    <div class="list-group">
                        <a href="{{ url_for('admin.admin_logs') }}" class="list-group-item list-group-item-action">
                            Журнал действий
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
