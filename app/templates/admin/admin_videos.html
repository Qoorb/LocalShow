{% extends 'base.html' %}

{% block content %}
<div class="card shadow">
    <div class="card-body">
        <h2 class="card-title mb-4">Каталог видео (Админ)</h2>
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Название</th>
                        <th>Описание</th>
                        <th>Статус</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    {% for video in videos %}
                    <tr>
                        <td>{{ video.title }}</td>
                        <td>{{ video.description }}</td>
                        <td>
                            <span class="badge {% if video.hidden %}bg-danger{% else %}bg-success{% endif %}">
                                {{ 'Скрыто' if video.hidden else 'Отображается' }}
                            </span>
                        </td>
                        <td>
                            <form method="POST" action="{{ url_for('admin_videos') }}" class="d-inline">
                                <input type="hidden" name="video_id" value="{{ video.id }}">
                                <button type="submit" class="btn btn-sm {% if video.hidden %}btn-success{% else %}btn-warning{% endif %}">
                                    {{ 'Показать' if video.hidden else 'Скрыть' }}
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
